name: Validate reference implementation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Add pinned chart repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add opencost https://opencost.github.io/opencost-helm-chart
          helm repo add grafana-community https://grafana-community.github.io/helm-charts

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck --external-sources --source-path=. scripts/*.sh

      - name: Validate dashboard JSON
        run: |
          ruby -ryaml -rjson -e 'JSON.parse(YAML.load_file("deploy/grafana/dashboard.yaml").dig("data", "vaipex-cost-capacity.json"))'

      - name: Render pinned Helm releases
        run: |
          source versions.env
          mkdir -p rendered
          helm template prometheus prometheus-community/prometheus \
            --version "${PROMETHEUS_CHART_VERSION}" \
            --namespace "${MONITORING_NAMESPACE}" \
            --values deploy/prometheus/values.yaml > rendered/prometheus.yaml
          helm template opencost opencost/opencost \
            --version "${OPENCOST_CHART_VERSION}" \
            --namespace "${OPENCOST_NAMESPACE}" \
            --values deploy/opencost/values.yaml > rendered/opencost.yaml
          helm template grafana grafana-community/grafana \
            --version "${GRAFANA_CHART_VERSION}" \
            --namespace "${MONITORING_NAMESPACE}" \
            --values deploy/grafana/values.yaml > rendered/grafana.yaml

      - name: Install pinned kubeconform
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            --output /tmp/kubeconform-linux-amd64.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform-linux-amd64.tar.gz' | sha256sum --check
          sudo tar --extract --gzip --file /tmp/kubeconform-linux-amd64.tar.gz \
            --directory /usr/local/bin kubeconform

      - name: Validate Kubernetes resource schemas
        run: |
          kubeconform -strict -summary \
            bootstrap/namespaces.yaml \
            deploy/workloads \
            deploy/grafana/datasource.yaml \
            deploy/grafana/dashboard.yaml \
            rendered
