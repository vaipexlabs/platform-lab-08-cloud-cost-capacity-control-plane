<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vaipex Cloud Cost and Capacity Control Plane flow</title>
  <desc id="desc">Owned Kubernetes workloads flow through measurement, cost allocation, capacity insight, and informed optimization decisions with continuous feedback.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1677ff"/><stop offset="1" stop-color="#6d42e8"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#152252" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#175ec8"/></marker>
    <style>
      .ink{fill:#07164f}.muted{fill:#53617f}.eyebrow{font:700 14px Arial,sans-serif;letter-spacing:1.4px}.title{font:800 39px Arial,sans-serif;letter-spacing:.4px}.cardtitle{font:700 22px Arial,sans-serif}.body{font:16px Arial,sans-serif}.small{font:14px Arial,sans-serif}.line{stroke:#175ec8;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <circle cx="1450" cy="40" r="235" fill="#f4efff" opacity=".78"/>
  <circle cx="90" cy="855" r="260" fill="#edf6ff" opacity=".9"/>

  <g transform="translate(583 28)"><path d="M0 0h36l24 43-17 29z" fill="#2877ff"/><path d="M72 0h36L66 72H43z" fill="#6d42e8"/><text x="135" y="55" class="ink" style="font:800 38px Arial,sans-serif;letter-spacing:4px">VAIPEX LABS</text></g>
  <text x="800" y="145" text-anchor="middle" class="title ink">CLOUD COST &amp; CAPACITY CONTROL PLANE</text>
  <text x="800" y="181" text-anchor="middle" class="body muted">Turn Kubernetes consumption into owned, explainable engineering decisions</text>

  <path d="M310 425H355" class="line"/><path d="M610 425H655" class="line"/><path d="M910 425H955" class="line"/><path d="M1210 425H1255" class="line"/>

  <g transform="translate(55 270)" filter="url(#shadow)">
    <rect width="255" height="310" rx="24" fill="url(#panel)" stroke="#2877ff" stroke-width="2"/>
    <circle cx="127" cy="66" r="38" fill="#eaf3ff" stroke="#2877ff" stroke-width="3"/>
    <path d="M106 75h42M112 62h30M119 49h16" stroke="#2877ff" stroke-width="5" stroke-linecap="round"/>
    <text x="127" y="133" text-anchor="middle" class="eyebrow ink">OWN</text>
    <text x="127" y="169" text-anchor="middle" class="cardtitle ink">Workloads</text>
    <text x="127" y="207" text-anchor="middle" class="body muted">Service identity</text><text x="127" y="235" text-anchor="middle" class="body muted">Team &amp; environment</text><text x="127" y="263" text-anchor="middle" class="body muted">Requests &amp; limits</text>
  </g>

  <g transform="translate(355 270)" filter="url(#shadow)">
    <rect width="255" height="310" rx="24" fill="#fff" stroke="#1677ff" stroke-width="2"/>
    <circle cx="127" cy="66" r="38" fill="#edf6ff" stroke="#1677ff" stroke-width="3"/>
    <path d="M103 78l15-18 13 11 21-27" stroke="#1677ff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="127" y="133" text-anchor="middle" class="eyebrow ink">MEASURE</text>
    <text x="127" y="169" text-anchor="middle" class="cardtitle ink">Consumption</text>
    <text x="127" y="207" text-anchor="middle" class="body muted">Actual CPU</text><text x="127" y="235" text-anchor="middle" class="body muted">Actual memory</text><text x="127" y="263" text-anchor="middle" class="body muted">Capacity metadata</text>
  </g>

  <g transform="translate(655 270)" filter="url(#shadow)">
    <rect width="255" height="310" rx="24" fill="url(#panel)" stroke="#6d42e8" stroke-width="2"/>
    <circle cx="127" cy="66" r="38" fill="#f3efff" stroke="#6d42e8" stroke-width="3"/>
    <text x="127" y="79" text-anchor="middle" style="font:800 38px Arial,sans-serif;fill:#6d42e8">$</text>
    <text x="127" y="133" text-anchor="middle" class="eyebrow ink">ALLOCATE</text>
    <text x="127" y="169" text-anchor="middle" class="cardtitle ink">Estimated Cost</text>
    <text x="127" y="207" text-anchor="middle" class="body muted">Declared pricing</text><text x="127" y="235" text-anchor="middle" class="body muted">Service &amp; team views</text><text x="127" y="263" text-anchor="middle" class="body muted">Idle allocation</text>
  </g>

  <g transform="translate(955 270)" filter="url(#shadow)">
    <rect width="255" height="310" rx="24" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="127" cy="66" r="38" fill="#f4f0ff" stroke="#7c3aed" stroke-width="3"/>
    <path d="M108 82V67M127 82V52M146 82V60" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/>
    <text x="127" y="133" text-anchor="middle" class="eyebrow ink">UNDERSTAND</text>
    <text x="127" y="169" text-anchor="middle" class="cardtitle ink">Capacity Insight</text>
    <text x="127" y="207" text-anchor="middle" class="body muted">Requested vs actual</text><text x="127" y="235" text-anchor="middle" class="body muted">Efficiency signals</text><text x="127" y="263" text-anchor="middle" class="body muted">Reliability context</text>
  </g>

  <g transform="translate(1255 270)" filter="url(#shadow)">
    <rect width="290" height="310" rx="24" fill="#fff" stroke="#16a085" stroke-width="2"/>
    <circle cx="145" cy="66" r="38" fill="#eaf9f5" stroke="#16a085" stroke-width="3"/>
    <path d="M124 68l14 14 29-34" stroke="#16a085" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="145" y="133" text-anchor="middle" class="eyebrow ink">DECIDE</text>
    <text x="145" y="169" text-anchor="middle" class="cardtitle ink">Optimize Safely</text>
    <text x="145" y="207" text-anchor="middle" class="body muted">Review recommendations</text><text x="145" y="235" text-anchor="middle" class="body muted">Protect headroom</text><text x="145" y="263" text-anchor="middle" class="body muted">Improve platform defaults</text>
  </g>

  <path d="M1400 580V690Q1400 735 1355 735H245Q190 735 190 680V585" stroke="#6d42e8" stroke-width="4" fill="none" stroke-dasharray="13 10" marker-end="url(#arrow)"/>
  <rect x="575" y="705" width="450" height="56" rx="28" fill="#fff" stroke="#d7c8ff" stroke-width="2"/>
  <text x="800" y="741" text-anchor="middle" style="font:700 20px Arial,sans-serif;fill:#6134d7">CONTINUOUS COST &amp; CAPACITY FEEDBACK</text>

  <rect x="70" y="810" width="700" height="58" rx="18" fill="#edf6ff" stroke="#8cc0ff"/><text x="98" y="846" class="small ink"><tspan font-weight="700">SERVICE TEAMS</tspan><tspan> — own workloads, reliability, and optimization decisions</tspan></text>
  <rect x="830" y="810" width="700" height="58" rx="18" fill="#f6f2ff" stroke="#c8afff"/><text x="858" y="846" class="small ink"><tspan font-weight="700">PLATFORM TEAM</tspan><tspan> — own measurement, allocation, guidance, and transparency</tspan></text>
</svg>
