<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vaipex Cloud Cost and Capacity Control Plane architecture</title>
  <desc id="desc">Technical architecture showing Kubernetes workload metadata and runtime usage collected by Prometheus, calculated by OpenCost and PromQL rules, and presented through Grafana.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f6f2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#152252" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#175ec8"/></marker>
    <style>
      .ink{fill:#07164f}.muted{fill:#53617f}.eyebrow{font:700 14px Arial,sans-serif;letter-spacing:1.3px}.title{font:800 38px Arial,sans-serif}.cardtitle{font:700 20px Arial,sans-serif}.body{font:16px Arial,sans-serif}.small{font:14px Arial,sans-serif}.line{stroke:#175ec8;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#6d42e8;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/><circle cx="1450" cy="40" r="235" fill="#f4efff" opacity=".78"/><circle cx="80" cy="850" r="250" fill="#edf6ff" opacity=".9"/>
  <g transform="translate(583 28)"><path d="M0 0h36l24 43-17 29z" fill="#2877ff"/><path d="M72 0h36L66 72H43z" fill="#6d42e8"/><text x="135" y="55" class="ink" style="font:800 38px Arial,sans-serif;letter-spacing:4px">VAIPEX LABS</text></g>
  <text x="800" y="145" text-anchor="middle" class="title ink">TECHNICAL ARCHITECTURE</text>
  <text x="800" y="181" text-anchor="middle" class="body muted">Compact, explicitly wired, and reproducible on a local kind cluster</text>

  <g transform="translate(45 230)" filter="url(#shadow)">
    <rect width="330" height="500" rx="24" fill="url(#panel)" stroke="#2877ff" stroke-width="2"/>
    <text x="165" y="42" text-anchor="middle" class="eyebrow ink">KUBERNETES / KIND</text>
    <g transform="translate(25 72)"><rect width="280" height="115" rx="16" fill="#fff" stroke="#d7ddea"/><text x="24" y="35" class="cardtitle ink">Owned Workloads</text><text x="24" y="64" class="small muted">service • team • environment</text><text x="24" y="89" class="small muted">requests • limits • replicas</text></g>
    <g transform="translate(25 210)"><rect width="280" height="105" rx="16" fill="#fff" stroke="#d7ddea"/><circle cx="42" cy="52" r="20" fill="#1677ff"/><path d="M31 57l9-11 8 7 10-14" stroke="#fff" stroke-width="3" fill="none"/><text x="78" y="45" class="cardtitle ink">kube-state-metrics</text><text x="78" y="70" class="small muted">declared object state</text></g>
    <g transform="translate(25 338)"><rect width="280" height="105" rx="16" fill="#fff" stroke="#d7ddea"/><circle cx="42" cy="52" r="20" fill="#16a085"/><path d="M31 58h22M35 48h14M39 38h6" stroke="#fff" stroke-width="3"/><text x="78" y="45" class="cardtitle ink">kubelet / cAdvisor</text><text x="78" y="70" class="small muted">actual container usage</text></g>
  </g>

  <path d="M375 480H445" class="line"/>
  <g transform="translate(450 300)" filter="url(#shadow)">
    <rect width="280" height="360" rx="24" fill="#fff" stroke="#1677ff" stroke-width="2"/>
    <circle cx="140" cy="76" r="44" fill="#edf6ff" stroke="#1677ff" stroke-width="3"/><path d="M113 89l17-22 15 13 24-33" stroke="#1677ff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="140" y="151" text-anchor="middle" class="eyebrow ink">METRICS PLANE</text>
    <text x="140" y="188" text-anchor="middle" class="cardtitle ink">Prometheus</text>
    <text x="140" y="230" text-anchor="middle" class="body muted">Scrape</text><text x="140" y="258" text-anchor="middle" class="body muted">Store</text><text x="140" y="286" text-anchor="middle" class="body muted">Query</text><text x="140" y="314" text-anchor="middle" class="body muted">Record derived signals</text>
  </g>

  <path d="M730 410H800" class="line"/><path d="M730 550H800" class="line"/>
  <g transform="translate(805 245)" filter="url(#shadow)">
    <rect width="330" height="210" rx="22" fill="url(#panel)" stroke="#6d42e8" stroke-width="2"/>
    <circle cx="55" cy="64" r="27" fill="#6d42e8"/><text x="55" y="75" text-anchor="middle" style="font:800 28px Arial,sans-serif;fill:#fff">$</text>
    <text x="100" y="58" class="eyebrow ink">ALLOCATION ENGINE</text><text x="100" y="91" class="cardtitle ink">OpenCost</text>
    <text x="28" y="135" class="small muted">Declared CPU, RAM &amp; storage prices</text><text x="28" y="165" class="small muted">Allocation by workload, namespace &amp; label</text><text x="28" y="193" class="small muted">Idle and shared-cost visibility</text>
  </g>
  <g transform="translate(805 505)" filter="url(#shadow)">
    <rect width="330" height="210" rx="22" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="55" cy="64" r="27" fill="#f2edff" stroke="#7c3aed" stroke-width="2"/><path d="M40 73V61M55 73V46M70 73V55" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
    <text x="100" y="58" class="eyebrow ink">DECISION SUPPORT</text><text x="100" y="91" class="cardtitle ink">Vaipex PromQL Rules</text>
    <text x="28" y="135" class="body muted">Actual usage ÷ requested capacity</text><text x="28" y="165" class="body muted">Sustained review thresholds</text><text x="28" y="193" class="body muted">Signals, never automatic resizing</text>
  </g>

  <path d="M1135 350H1210V460H1260" class="line"/><path d="M1135 610H1210V500H1260" class="line"/>
  <g transform="translate(1265 300)" filter="url(#shadow)">
    <rect width="290" height="360" rx="24" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="145" cy="75" r="44" fill="#fff6e6" stroke="#f59e0b" stroke-width="3"/><path d="M117 86l18-23 17 14 22-31" stroke="#f59e0b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="145" y="151" text-anchor="middle" class="eyebrow ink">EXPERIENCE LAYER</text><text x="145" y="188" text-anchor="middle" class="cardtitle ink">Grafana</text>
    <text x="145" y="230" text-anchor="middle" class="body muted">Cost allocation</text><text x="145" y="258" text-anchor="middle" class="body muted">Requested vs actual</text><text x="145" y="286" text-anchor="middle" class="body muted">Review signals</text><text x="145" y="314" text-anchor="middle" class="body muted">Assumptions &amp; freshness</text>
  </g>

  <path d="M970 245V212H590V295" class="dash"/>
  <rect x="685" y="201" width="255" height="42" rx="21" fill="#fff" stroke="#d7c8ff"/><text x="812" y="228" text-anchor="middle" class="small ink">OpenCost queries Prometheus</text>

  <rect x="60" y="790" width="1480" height="60" rx="18" fill="#f7f9ff" stroke="#c9d6f5"/>
  <text x="95" y="826" class="small ink"><tspan font-weight="700">PACKAGING:</tspan><tspan x="188">separate, version-pinned Helm releases for Prometheus Community charts, OpenCost, and Grafana</tspan></text>
</svg>
